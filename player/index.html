<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUTSY Radio Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
    }

    #radio-player {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: left;
      gap: 20px;
      color: white;
    }

    #player-container {
      position: relative;
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
    }

    #play-pause-button {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
    }

    #play-pause-button:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    #play-pause-icon {
      width: 32px;
      height: 32px;
      opacity: 0.8;
    }

    #song-info {
      text-align: left;
    }

    #title {
      font-size: 18px;
      margin: 0 0 5px;
      color: white;
    }

    #artist {
      font-size: 14px;
      margin: 0 0 8px;
      color: white;
    }

    #volume-control-container {
      display: flex;
      align-items: center;
    }

    #volume-icon {
      width: 20px;
      margin-right: 10px;
      opacity: 0.8;
    }

    #volume-control {
      width: 170px;
      accent-color: white;
    }

    #player-message {
      margin: 8px 0 0;
      font-size: 12px;
      color: white;
    }
  </style>
</head>
<body>
  <div id="radio-player">
    <div id="player-container">
      <button id="play-pause-button" type="button" onclick="togglePlayPause()" aria-label="Play GUTSY Radio">
        <img id="play-pause-icon" src="play.png" alt="">
      </button>
    </div>

    <div id="song-info">
      <p id="title">GUTSY Radio</p>
      <p id="artist">Live station stream</p>
      <div id="volume-control-container">
        <img src="speaker.png" alt="" id="volume-icon">
        <input type="range" id="volume-control" min="0" max="100" value="80" step="1"
          aria-label="Volume" oninput="changeVolume()">
      </div>
      <p id="player-message" aria-live="polite">Press play to listen.</p>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>

  <script>
    const GUTSY_STREAM_URL = "https://broadcast.gutsyradio.org/hls/gutsy_radio/live.m3u8";
    const audio = document.getElementById("audio");
    const volumeControl = document.getElementById("volume-control");
    const playButton = document.getElementById("play-pause-button");
    const playPauseIcon = document.getElementById("play-pause-icon");
    const playerMessage = document.getElementById("player-message");
    let hlsPlayer = null;
    let streamInitialized = false;

    audio.volume = volumeControl.value / 100;

    function initializeStream() {
      if (streamInitialized) return true;
      streamInitialized = true;

      if (window.Hls && Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(GUTSY_STREAM_URL);
        hlsPlayer.attachMedia(audio);
        hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            playerMessage.textContent = "The GUTSY stream is temporarily unavailable. Please try again later.";
          }
        });
        return true;
      }

      if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        audio.src = GUTSY_STREAM_URL;
        return true;
      }

      playerMessage.textContent = "This browser cannot play the live stream. Please listen at GUTSYRadio.org.";
      return false;
    }

    async function togglePlayPause() {
      if (audio.paused) {
        if (!initializeStream()) return;
        playerMessage.textContent = "Connecting to GUTSY Radio…";
        try {
          await audio.play();
        } catch (error) {
          playerMessage.textContent = "Could not start the stream. Please try again.";
        }
      } else {
        audio.pause();
      }
    }

    function changeVolume() {
      audio.volume = volumeControl.value / 100;
    }

    audio.addEventListener("playing", () => {
      playPauseIcon.src = "pause.png";
      playButton.setAttribute("aria-label", "Pause GUTSY Radio");
      playerMessage.textContent = "Now playing GUTSY Radio.";
    });

    audio.addEventListener("pause", () => {
      playPauseIcon.src = "play.png";
      playButton.setAttribute("aria-label", "Play GUTSY Radio");
      playerMessage.textContent = "Press play to listen.";
    });

    audio.addEventListener("waiting", () => {
      playerMessage.textContent = "Connecting to GUTSY Radio…";
    });

    audio.addEventListener("error", () => {
      playerMessage.textContent = "The GUTSY stream is temporarily unavailable. Please try again later.";
    });
  </script>
</body>
</html>
